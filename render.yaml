services:
  - type: web
    name: campus-compass
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-compass-db
          property: connectionString

databases:
  - name: campus-compass-db
    plan: free
