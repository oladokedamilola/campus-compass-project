<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0D0D0D">
    <meta name="description" content="Campus Compass - Navigation app for LASU Ojo Campus">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Campus Compass">
    <title>Campus Compass - {% block title %}{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Fonts -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/icons/favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='images/icons/favicon-16x16.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/icons/favicon-32x32.png') }}">

    <!-- Apple Touch Icon (iOS) -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/icons/apple-touch-icon.png') }}">

    <!-- Android Chrome Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='images/icons/icon-192.png') }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='images/icons/icon-512.png') }}">

    {% block extra_css %}{% endblock %}
</head>
<body class="user-body">
    <!-- General Preloader -->
    <div id="general-preloader" class="preloader">
        <div class="preloader-container">
            <div class="compass-needle">
                <div class="needle-center"></div>
                <div class="needle-north"></div>
                <div class="needle-south"></div>
            </div>
            <div class="compass-orbits">
                <div class="orbit-dot dot-1"></div>
                <div class="orbit-dot dot-2"></div>
                <div class="orbit-dot dot-3"></div>
            </div>
        </div>
    </div>
    
    <!-- Flash Messages Container -->
    <div id="flash-container" class="flash-container"></div>
    
    <!-- Sidebar Overlay (Mobile/Tablet only) -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    
    <!-- Sidebar Navigation - GUEST VERSION (No login-protected links) -->
    <aside id="sidebar" class="user-sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i class="fas fa-compass"></i>
                <span>Campus Compass</span>
            </div>
            <button id="close-sidebar-btn" class="close-sidebar-btn">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <!-- Guest Profile Section -->
        <div class="sidebar-user">
            <div class="user-avatar">
                <i class="fas fa-user-friends"></i>
            </div>
            <div class="user-info">
                <h4>Guest User</h4>
                <span class="user-badge" style="background: rgba(0, 240, 255, 0.15); color: var(--campus-accent);">
                    <i class="fas fa-globe"></i> Public Access
                </span>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <a href="{{ url_for('main.index') }}" class="sidebar-link {% if request.endpoint == 'main.index' %}active{% endif %}">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="{{ url_for('map.public_map') }}" class="sidebar-link {% if request.endpoint == 'map.public_map' %}active{% endif %}">
                <i class="fas fa-map-marked-alt"></i>
                <span>Map</span>
            </a>
            <a href="{{ url_for('main.public_locations') }}" class="sidebar-link {% if request.endpoint == 'main.public_locations' %}active{% endif %}">
                <i class="fas fa-building"></i>
                <span>All Locations</span>
            </a>
            
            <div class="sidebar-divider"></div>
            <div class="sidebar-section-title">
                <span>Account</span>
            </div>
            <a href="{{ url_for('auth.login_page') }}" class="sidebar-link">
                <i class="fas fa-sign-in-alt"></i>
                <span>Login</span>
            </a>
            <a href="{{ url_for('auth.verify_matric_page') }}" class="sidebar-link">
                <i class="fas fa-user-plus"></i>
                <span>Register</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            <div class="sidebar-version">
                <small>v1.0.0 | LASU Ojo Campus</small>
            </div>
        </div>
    </aside>
    
    <!-- Main Content Area -->
    <main class="user-main">
        <div class="user-topbar">
            <button id="toggle-sidebar-btn" class="toggle-sidebar-btn">
                <i class="fas fa-bars"></i>
            </button>
            <div class="topbar-title">
                {% block topbar_title %}Campus Compass{% endblock %}
            </div>
            <div class="topbar-right">
                <span class="topbar-greeting">
                    <i class="fas fa-globe"></i>
                    <span>Guest Mode</span>
                </span>
            </div>
        </div>
        
        <div class="user-content">
            {% block content %}{% endblock %}
        </div>
    </main>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/flash.js') }}"></script>
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
    
    <!-- Flash messages from Flask to JavaScript -->
    <script>
        const flashedMessages = [
            {% for message in get_flashed_messages(with_categories=true) %}
                { category: '{{ message[0] }}', message: '{{ message[1]|safe }}' }{% if not loop.last %},{% endif %}
            {% endfor %}
        ];
    </script>
    
    <!-- PWA Installation & Offline Detection -->
    <script src="{{ url_for('static', filename='js/pwa.js') }}"></script>
    
    <!-- Sidebar Toggle JavaScript -->
    <script>
        (function() {
            const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebar-overlay');
            const closeSidebarBtn = document.getElementById('close-sidebar-btn');
            const mainContent = document.querySelector('.user-main');
            
            function isDesktop() {
                return window.innerWidth >= 1025;
            }
            
            function isTablet() {
                return window.innerWidth >= 769 && window.innerWidth <= 1024;
            }
            
            function isMobile() {
                return window.innerWidth <= 768;
            }
            
            function updateMainContentMargin() {
                if (!mainContent) return;
                
                if (isDesktop()) {
                    mainContent.style.marginLeft = '280px';
                } else if (isTablet()) {
                    if (sidebar && sidebar.classList.contains('open')) {
                        mainContent.style.marginLeft = '280px';
                    } else {
                        mainContent.style.marginLeft = '80px';
                    }
                } else if (isMobile()) {
                    mainContent.style.marginLeft = '0px';
                }
            }
            
            function updateButtons() {
                if (isDesktop()) {
                    if (toggleSidebarBtn) toggleSidebarBtn.style.display = 'none';
                    if (closeSidebarBtn) closeSidebarBtn.style.display = 'none';
                } else if (isTablet() || isMobile()) {
                    const isOpen = sidebar && sidebar.classList.contains('open');
                    if (toggleSidebarBtn) {
                        toggleSidebarBtn.style.display = isOpen ? 'none' : 'flex';
                    }
                    if (closeSidebarBtn) {
                        closeSidebarBtn.style.display = isOpen ? 'flex' : 'none';
                    }
                }
            }
            
            function openSidebar() {
                if (!sidebar) return;
                sidebar.classList.add('open');
                if (sidebarOverlay) sidebarOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                if (isTablet()) updateMainContentMargin();
                updateButtons();
            }
            
            function closeSidebar() {
                if (!sidebar) return;
                sidebar.classList.remove('open');
                if (sidebarOverlay) sidebarOverlay.classList.remove('active');
                document.body.style.overflow = '';
                if (isTablet()) updateMainContentMargin();
                updateButtons();
            }
            
            if (toggleSidebarBtn) {
                toggleSidebarBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (sidebar && sidebar.classList.contains('open')) {
                        closeSidebar();
                    } else {
                        openSidebar();
                    }
                });
            }
            
            if (closeSidebarBtn) {
                closeSidebarBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    closeSidebar();
                });
            }
            
            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', function() {
                    closeSidebar();
                });
            }
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && sidebar && sidebar.classList.contains('open')) {
                    closeSidebar();
                }
            });
            
            window.addEventListener('resize', function() {
                if (isDesktop()) {
                    if (sidebar) {
                        sidebar.classList.remove('open');
                        if (sidebarOverlay) sidebarOverlay.classList.remove('active');
                        document.body.style.overflow = '';
                    }
                    updateMainContentMargin();
                    updateButtons();
                } else if (isTablet()) {
                    updateMainContentMargin();
                    updateButtons();
                } else if (isMobile()) {
                    updateMainContentMargin();
                    updateButtons();
                }
            });
            
            // Initial setup
            if (isDesktop()) {
                if (sidebar) sidebar.classList.remove('open');
                updateMainContentMargin();
                updateButtons();
            } else if (isTablet()) {
                if (sidebar) sidebar.classList.remove('open');
                updateMainContentMargin();
                updateButtons();
            } else if (isMobile()) {
                if (sidebar) sidebar.classList.remove('open');
                updateMainContentMargin();
                updateButtons();
            }
        })();
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
