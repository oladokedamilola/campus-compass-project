<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0D0D0D">
    <title>Campus Compass - Offline</title>
    
    <!-- Custom Fonts -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #0D0D0D;
            color: #FFFFFF;
            font-family: 'Satoshi', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .offline-container {
            text-align: center;
            max-width: 400px;
        }
        
        .offline-icon {
            font-size: 80px;
            color: #00F0FF;
            margin-bottom: 24px;
        }
        
        h1 {
            font-family: 'Clash Display', sans-serif;
            font-size: 28px;
            margin-bottom: 12px;
        }
        
        p {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
            line-height: 1.6;
        }
        
        .btn-retry {
            background: #00F0FF;
            color: #0D0D0D;
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }
        
        .btn-retry:hover {
            background: #00C8D4;
            transform: translateY(-2px);
        }
        
        .offline-features {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .offline-features h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #00F0FF;
        }
        
        .feature-list {
            list-style: none;
            text-align: left;
        }
        
        .feature-list li {
            margin-bottom: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .feature-list li i {
            color: #00E676;
            width: 20px;
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 24px; }
            .offline-icon { font-size: 60px; }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <i class="fas fa-wifi"></i>
        </div>
        <h1>You're Offline</h1>
        <p>
            Don't worry! You can still access your saved favorites 
            and previously loaded campus data.
        </p>
        <button class="btn-retry" onclick="window.location.reload()">
            <i class="fas fa-sync-alt"></i> Try Again
        </button>
        
        <div class="offline-features">
            <h3>Available Offline:</h3>
            <ul class="feature-list">
                <li><i class="fas fa-check-circle"></i> View saved favorites</li>
                <li><i class="fas fa-check-circle"></i> Access cached campus map</li>
                <li><i class="fas fa-check-circle"></i> Previously searched locations</li>
                <li><i class="fas fa-check-circle"></i> Campus building information</li>
            </ul>
        </div>
    </div>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
