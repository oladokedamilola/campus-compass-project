<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0D0D0D">
    <title>Campus Compass - Offline</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Fonts -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #0D0D0D 0%, #1a1a2e 100%);
            font-family: 'Satoshi', sans-serif;
            min-height: 100vh;
        }
        
        .offline-card {
            background: rgba(13, 13, 13, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 24px;
            padding: 48px 32px;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .offline-icon {
            width: 100px;
            height: 100px;
            background: rgba(0, 240, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            border: 2px solid rgba(0, 240, 255, 0.3);
        }
        
        .offline-icon i {
            font-size: 48px;
            color: #00F0FF;
        }
        
        h1 {
            font-family: 'Clash Display', sans-serif;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #FFFFFF 0%, #00F0FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .offline-message {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .btn-retry {
            background: linear-gradient(135deg, #00F0FF 0%, #00C8D4 100%);
            color: #0D0D0D;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 24px;
        }
        
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 240, 255, 0.3);
        }
        
        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        
        .feature-item.available i {
            color: #00E676;
        }
        
        .feature-item.unavailable i {
            color: #FF1744;
        }
        
        .feature-item i {
            width: 18px;
            font-size: 14px;
        }
        
        .feature-item span {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .warning-text {
            margin-top: 24px;
            font-size: 12px;
            color: #FFD600;
        }
        
        .warning-text i {
            margin-right: 6px;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        .offline-icon {
            animation: float 3s ease-in-out infinite;
        }
        
        @media (max-width: 576px) {
            .offline-card {
                padding: 32px 20px;
                margin: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .features-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="offline-card">
            <div class="offline-icon">
                <i class="fas fa-wifi-slash"></i>
            </div>
            
            <h1>You're Offline</h1>
            
            <p class="offline-message">
                Please check your internet connection and try again.
            </p>
            
            <button class="btn-retry" onclick="window.location.reload()">
                <i class="fas fa-sync-alt me-2"></i>Try Again
            </button>
            
            <div class="features-grid">
                <div class="feature-item available">
                    <i class="fas fa-check-circle"></i>
                    <span>View offline page</span>
                </div>
                <div class="feature-item available">
                    <i class="fas fa-check-circle"></i>
                    <span>Saved favorites*</span>
                </div>
                <div class="feature-item unavailable">
                    <i class="fas fa-times-circle"></i>
                    <span>Interactive map</span>
                </div>
                <div class="feature-item unavailable">
                    <i class="fas fa-times-circle"></i>
                    <span>Search buildings</span>
                </div>
                <div class="feature-item unavailable">
                    <i class="fas fa-times-circle"></i>
                    <span>Get directions</span>
                </div>
                <div class="feature-item unavailable">
                    <i class="fas fa-times-circle"></i>
                    <span>Login/Register</span>
                </div>
            </div>
            
            <div class="warning-text">
                <i class="fas fa-info-circle"></i>
                *Some features may be limited while offline
            </div>
        </div>
    </div>
    
    <script>
        // Auto-retry when connection returns
        window.addEventListener('online', function() {
            window.location.reload();
        });
        
        // Retry button handler
        document.querySelector('.btn-retry')?.addEventListener('click', function() {
            if (navigator.onLine) {
                window.location.href = '/';
            } else {
                alert('Still offline. Please check your connection.');
            }
        });
    </script>
</body>
</html>
