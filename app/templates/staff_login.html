{% extends 'base_public.html' %}

{% block title %}Staff Login{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="campus-glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="mb-3">
                    <i class="fas fa-user-shield fa-3x" style="color: var(--campus-accent);"></i>
                </div>
                <h1 class="h3 fw-bold campus-text-gradient">Staff Login</h1>
                <p class="text-white-50 mt-2">
                    Authorized personnel only
                </p>
            </div>
            
            <form id="loginForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="mb-3">
                    <label for="matric_number" class="form-label text-white">Staff ID</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--campus-gray-600);">
                            <i class="fas fa-id-badge" style="color: var(--campus-gray-500);"></i>
                        </span>
                        <input type="text" class="form-control form-control-campus border-start-0" 
                               id="matric_number" name="matric_number" placeholder="e.g., ADMIN001" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label text-white">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--campus-gray-600);">
                            <i class="fas fa-lock" style="color: var(--campus-gray-500);"></i>
                        </span>
                        <input type="password" class="form-control form-control-campus border-start-0" 
                               id="password" name="password" placeholder="••••••" required>
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password" style="background: transparent; border-color: var(--campus-gray-600);">
                            <i class="fas fa-eye-slash" style="color: var(--campus-gray-500);"></i>
                        </button>
                    </div>
                </div>
                
                <div class="mb-3 form-check d-flex justify-content-between align-items-center">
                    <div>
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label text-white-50" for="remember">Remember me</label>
                    </div>
                    <a href="{{ url_for('auth.forgot_password_page') }}" class="text-decoration-none small" style="color: var(--campus-accent);">
                        Forgot Password?
                    </a>
                </div>
                
                <button type="submit" class="btn btn-campus-accent w-100 py-3 fw-bold" id="loginBtn">
                    <i class="fas fa-sign-in-alt me-2"></i>Staff Login
                </button>
            </form>
            
            <div class="text-center mt-4">
                <p class="text-white-50 mb-0">
                    Student login? 
                    <a href="{{ url_for('auth.login_page') }}" class="text-decoration-none fw-bold" style="color: var(--campus-accent);">
                        Click here
                    </a>
                </p>
            </div>
            
            <div class="text-center mt-3">
                <p class="small text-white-50">
                    <i class="fas fa-shield-alt me-1"></i> Restricted access for authorized staff only
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Setup password toggle
function setupPasswordToggle() {
    const toggleButtons = document.querySelectorAll('.toggle-password');
    toggleButtons.forEach(button => {
        button.addEventListener('click', function() {
            const targetId = this.getAttribute('data-target');
            const input = document.getElementById(targetId);
            const icon = this.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        });
    });
}

// Form submission
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const btn = document.getElementById('loginBtn');
    const originalText = btn.innerHTML;
    
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Authenticating...';
    btn.disabled = true;
    
    const data = {
        matric_number: document.getElementById('matric_number').value.trim().toUpperCase(),
        password: document.getElementById('password').value,
        remember: document.getElementById('remember').checked
    };
    
    if (!data.matric_number || !data.password) {
        if (typeof notify !== 'undefined') {
            notify.error('Please fill in all fields');
        } else {
            alert('Please fill in all fields');
        }
        btn.innerHTML = originalText;
        btn.disabled = false;
        return;
    }
    
    try {
        const response = await fetch('/auth/staff-login', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrf_token]').value
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (result.success) {
            if (typeof notify !== 'undefined') {
                notify.success(result.message);
            }
            setTimeout(() => {
                window.location.href = result.redirect;
            }, 500);
        } else {
            if (typeof notify !== 'undefined') {
                notify.error(result.message);
            } else {
                alert(result.message);
            }
            btn.innerHTML = originalText;
            btn.disabled = false;
            document.getElementById('password').value = '';
        }
    } catch (error) {
        console.error('Login error:', error);
        if (typeof notify !== 'undefined') {
            notify.error('Network error. Please try again.');
        } else {
            alert('Network error. Please try again.');
        }
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
});

// Enter key support
document.getElementById('password').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }
});

setupPasswordToggle();
</script>
{% endblock %}
