<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C8D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#darkGradient)" stroke="url(#accentGradient)" stroke-width="2.5"/>
  
  <!-- Outer ring glow -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.3"/>
  
  <!-- Compass Rose - North Pointer -->
  <polygon points="50,12 60,45 50,48 40,45" fill="url(#accentGradient)"/>
  <polygon points="50,12 50,48" fill="#00F0FF" opacity="0.4"/>
  
  <!-- Compass Rose - South Pointer -->
  <polygon points="50,88 60,55 50,52 40,55" fill="#333333"/>
  
  <!-- Compass Rose - East Pointer -->
  <polygon points="88,50 55,60 52,50 55,40" fill="#333333"/>
  
  <!-- Compass Rose - West Pointer -->
  <polygon points="12,50 45,60 48,50 45,40" fill="#333333"/>
  
  <!-- Cardinal points - NE, NW, SE, SW -->
  <polygon points="68,32 75,25 70,30" fill="#444444"/>
  <polygon points="32,32 25,25 30,30" fill="#444444"/>
  <polygon points="68,68 75,75 70,70" fill="#444444"/>
  <polygon points="32,68 25,75 30,70" fill="#444444"/>
  
  <!-- Center Circle -->
  <circle cx="50" cy="50" r="10" fill="#0D0D0D" stroke="url(#accentGradient)" stroke-width="2"/>
  
  <!-- Inner center dot -->
  <circle cx="50" cy="50" r="3" fill="#00F0FF"/>
  
  <!-- N label -->
  <text x="50" y="26" font-family="'Clash Display', Arial, sans-serif" font-size="9" fill="#00F0FF" text-anchor="middle" font-weight="700" letter-spacing="1">N</text>
  
  <!-- S label -->
  <text x="50" y="84" font-family="'Clash Display', Arial, sans-serif" font-size="8" fill="#666666" text-anchor="middle" font-weight="600" letter-spacing="1">S</text>
  
  <!-- E label -->
  <text x="79" y="54" font-family="'Clash Display', Arial, sans-serif" font-size="8" fill="#666666" text-anchor="middle" font-weight="600" letter-spacing="1">E</text>
  
  <!-- W label -->
  <text x="21" y="54" font-family="'Clash Display', Arial, sans-serif" font-size="8" fill="#666666" text-anchor="middle" font-weight="600" letter-spacing="1">W</text>
  
  <!-- Decorative rings -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#accentGradient)" stroke-width="0.5" opacity="0.3"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="url(#accentGradient)" stroke-width="0.5" opacity="0.2"/>
</svg>